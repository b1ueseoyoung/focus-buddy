appId: local.focusbuddy.candidate
productName: Focus Buddy Candidate
buildVersion: 0.1.0.6
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/icon.png
  - resources/tray-icon.png
  - resources/tray-icon@2x.png
  - resources/menu-cat/*.png
  - resources/menu-cat/face-playback.json
  - resources/focus-menu-helper
  - licenses/**/*
  - LICENSE
  - ARTWORK-LICENSE.md
  - THIRD_PARTY_NOTICES.md
  - package.json
asarUnpack:
  - resources/**
mac:
  icon: resources/icon.icns
  target:
    - target: dir
      arch: [arm64]
  notarize: false
npmRebuild: false
afterPack: scripts/adhoc-sign.cjs
