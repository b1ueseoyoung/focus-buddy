appId: local.focusbuddy.candidate
productName: Focus Buddy Candidate
buildVersion: 0.1.0.6
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/icon.png
  - resources/tray-icon.png
  - resources/tray-icon@2x.png
  - resources/menu-cat/*.png
  - resources/menu-cat/face-playback.json
  - licenses/**/*
  - LICENSE
  - ARTWORK-LICENSE.md
  - THIRD_PARTY_NOTICES.md
  - package.json
asarUnpack:
  - resources/**
mac:
  files:
    - resources/focus-menu-helper
  icon: resources/icon.icns
  target:
    - target: dir
      arch: [arm64]
  notarize: false
win:
  icon: resources/icon.ico
  files:
    - resources/icon.ico
    - '!resources/focus-menu-helper'
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: Focus-Buddy-Candidate-${version}-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
npmRebuild: false
afterPack: scripts/adhoc-sign.cjs
